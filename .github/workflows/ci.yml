name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Builds bin/ and runs the unit tests; no Herdr needed. On Windows the
      # fixture listens on a named pipe, so this also covers the pipe path that
      # cannot be exercised anywhere else.
      - run: npm test

      # The hooks run bin/herdr-report.js directly, so a stale build is a real
      # bug users would hit. Fail if src/ was edited without rebuilding.
      - name: Check the committed build output is current
        shell: bash
        run: git diff --exit-code -- bin/herdr-report.js
